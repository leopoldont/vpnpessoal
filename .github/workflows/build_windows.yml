name: Gerar Instalador Windows 11 (.MSI e .EXE)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Baixar Código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install cx_Freeze pyinstaller

    - name: Gerar Instalador .MSI Nativo (cx_Freeze)
      run: |
        python setup_msi.py bdist_msi

    - name: Gerar Executável Portátil .EXE (PyInstaller)
      run: |
        pyinstaller --noconfirm --onefile --windowed --uac-admin --name "VPN-Switch-Portable" --add-data "vpn_engine.py;." --add-data "gui.py;." main.py

    - name: Salvar Instaladores como Artefatos para Download
      uses: actions/upload-artifact@v4
      with:
        name: VPN-Switch-Windows-Installers
        path: |
          dist/*.msi
          dist/VPN-Switch-Portable.exe
